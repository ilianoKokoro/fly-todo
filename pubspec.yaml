name: fly_todo
description: "A simple cross-platform material design TODO app made with Flutter."
publish_to: "none"
version: 3.0.0

environment:
    sdk: ^3.12.2

dependencies:
    dynamic_color: ^2.1.0
    flutter:
        sdk: flutter
    firebase_auth: ^7.0.1
    firebase_core: ^5.1.0
    cloud_firestore: ^7.1.0
    google_sign_in: ^7.2.0
    material_ui: ^1.9.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0
    msix: ^3.18.0
    flutter_launcher_icons: ^0.14.4

msix_config:
    display_name: Fly TODO
    publisher_display_name: ilianoKokoro
    identity_name: ilianoKokoro.FlyTODO
    family_name: ilianoKokoro.FlyTODO_e59jqyr24yf08
    msix_version: 3.0.0.0
    logo_path: web/icons/web-app-manifest-512x512.png
    capabilities: internetClient
    architecture: x64
    publisher: CN=FBE2EC37-2851-4624-9F60-D21F9C6C6665
    store: true

flutter_launcher_icons:
    android: true
    image_path: "assets/icon/icon.png"
    min_sdk_android: 21
    adaptive_icon_background: "#fa5757"
    adaptive_icon_foreground: "assets/icon/icon.png"
    web:
        generate: true
        image_path: "assets/icon/icon.png"
        background_color: "#fa5757"
        theme_color: "#fa5757"

flutter:
    uses-material-design: true
    assets:
        - assets/google.png
